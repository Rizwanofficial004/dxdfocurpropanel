<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking - Improved Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Override unwanted pseudo-element content from extensions */
        .dRSeQr::before,
        .dRSeQr::after,
        *[class*="dRSeQr"]::before,
        *[class*="dRSeQr"]::after {
            content: none !important;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: none !important;
        }

        /* Ensure clean pseudo-elements on images */
        img::before,
        img::after,
        .screenshot::before,
        .screenshot::after,
        .user-screenshot::before,
        .user-screenshot::after {
            content: none !important;
            display: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
        }

        .control-group {
            flex: 1;
            min-width: 150px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 0.9rem;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: #4CAF50;
        }

        .btn-refresh:hover {
            background: #45a049;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .summary-item .number {
            font-size: 2rem;
            font-weight: bold;
            color: #4299e1;
            margin-bottom: 5px;
        }

        .summary-item .label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
        }

        .status-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid white;
        }

        .user-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .user-info .email {
            opacity: 0.8;
            font-size: 0.8rem;
        }

        .user-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .stat .number {
            font-weight: bold;
            color: #4299e1;
            font-size: 1.1rem;
        }

        .stat .label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 3px;
        }

        .screenshot-section {
            margin-top: 15px;
        }

        .screenshot-section h4 {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .screenshot-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screenshot-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .screenshot-image:hover {
            transform: scale(1.05);
        }

        .screenshot-placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            text-align: center;
        }

        .screenshot-loading {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .screenshot-error {
            color: #ff6b6b;
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
        }

        .screenshot-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .status-active { background-color: #48bb78; }
        .status-idle { background-color: #ed8936; }
        .status-offline { background-color: #e53e3e; }
        .status-meeting { background-color: #667eea; }
        .status-break { background-color: #38b2ac; }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 Live Tracking - Improved</h1>
            <p>Real-time employee monitoring with enhanced image loading</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Limit</label>
                <select id="limitFilter">
                    <option value="10">10 Users</option>
                    <option value="20">20 Users</option>
                    <option value="50">50 Users</option>
                    <option value="100">100 Users</option>
                </select>
            </div>

            <div class="control-group">
                <label>Status Filter</label>
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="idle">Idle</option>
                    <option value="meeting">Meeting</option>
                    <option value="break">Break</option>
                    <option value="offline">Offline</option>
                </select>
            </div>

            <div class="control-group">
                <label>Sort By</label>
                <select id="sortFilter">
                    <option value="name">Name</option>
                    <option value="email">Email</option>
                    <option value="last_activity">Last Activity</option>
                </select>
            </div>

            <button class="btn btn-refresh" onclick="loadLiveTracking()">🔄 Refresh</button>
            <button class="btn" onclick="toggleAutoRefresh()">⏰ Auto Refresh</button>
        </div>

        <div id="errorContainer"></div>
        <div id="summaryContainer"></div>
        <div id="loadingContainer"></div>
        <div id="usersContainer"></div>
    </div>

    <script>
        let currentData = null;
        let autoRefreshInterval = null;
        let isAutoRefreshEnabled = false;

        // API Configuration
        const API_BASE = 'http://127.0.0.1:8000/api';

        async function loadLiveTracking() {
            try {
                showLoading();
                clearError();

                // Build parameters
                const params = new URLSearchParams({
                    limit: document.getElementById('limitFilter').value,
                    status: document.getElementById('statusFilter').value,
                    sort_by: document.getElementById('sortFilter').value
                });

                console.log('📡 Making API request:', `${API_BASE}/live-tracking/fast-screenshots/?${params}`);

                const response = await fetch(`${API_BASE}/live-tracking/fast-screenshots/?${params}`);
                const data = await response.json();

                if (data.success) {
                    currentData = data.data;
                    displaySummary(data.data.summary);
                    displayUsers(data.data.users);
                    console.log('✅ Data loaded successfully:', data.data.summary);
                } else {
                    showError('API Error: ' + data.message);
                    console.error('❌ API Error:', data.message);
                }
            } catch (error) {
                showError('Network Error: ' + error.message);
                console.error('❌ Network Error:', error);
            } finally {
                hideLoading();
            }
        }

        function displaySummary(summary) {
            const container = document.getElementById('summaryContainer');
            container.innerHTML = `
                <div class="summary fade-in">
                    <div class="summary-item">
                        <div class="number">${summary.total_users_processed || 0}</div>
                        <div class="label">Total Users</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.users_with_screenshots || 0}</div>
                        <div class="label">With Screenshots</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.users_without_screenshots || 0}</div>
                        <div class="label">No Screenshots</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.total_screenshots_found || 0}</div>
                        <div class="label">Screenshots Found</div>
                    </div>
                </div>
            `;
        }

        function displayUsers(users) {
            const container = document.getElementById('usersContainer');
            
            if (!users || users.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <p>No users found with current filters</p>
                        <p>Try adjusting the filters above</p>
                    </div>
                `;
                return;
            }

            const usersHTML = users.map(user => createUserCard(user)).join('');
            container.innerHTML = `<div class="users-grid fade-in">${usersHTML}</div>`;
        }

        function createUserCard(user) {
            const initials = user.display_name ? 
                user.display_name.split(' ').map(n => n[0]).join('').toUpperCase() : 
                user.email.substring(0, 2).toUpperCase();
            
            const statusClass = `status-${user.status.toLowerCase()}`;
            const screenshot = user.latest_screenshot;
            
            return `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-avatar">
                            ${initials}
                            <div class="status-indicator ${statusClass}"></div>
                        </div>
                        <div class="user-info">
                            <h3>${user.display_name || 'Unknown'}</h3>
                            <div class="email">${user.email}</div>
                        </div>
                    </div>

                    <div class="user-stats">
                        <div class="stat">
                            <div class="number">${screenshot.has_screenshot ? '✅' : '❌'}</div>
                            <div class="label">Screenshot</div>
                        </div>
                        <div class="stat">
                            <div class="number">${user.status}</div>
                            <div class="label">Status</div>
                        </div>
                    </div>

                    <div class="screenshot-section">
                        <h4>Latest Screenshot</h4>
                        <div class="screenshot-container">
                            ${createScreenshotContent(screenshot, user.email)}
                        </div>
                    </div>
                </div>
            `;
        }

        function createScreenshotContent(screenshot, userEmail) {
            if (!screenshot.has_screenshot || !screenshot.url) {
                return `
                    <div class="screenshot-placeholder">
                        📷<br>
                        <div style="font-size: 0.8rem; margin-top: 5px;">No screenshot available</div>
                    </div>
                `;
            }

            const imageId = `img-${userEmail.replace('@', '-').replace('.', '-')}`;
            
            return `
                <div class="screenshot-loading" id="loading-${imageId}">
                    <div class="spinner"></div>
                    Loading image...
                </div>
                <img id="${imageId}" 
                     src="${screenshot.url}" 
                     alt="Screenshot for ${userEmail}"
                     class="screenshot-image"
                     style="display: none;"
                     onload="handleImageLoad('${imageId}')"
                     onerror="handleImageError('${imageId}', '${userEmail}')"
                     loading="lazy">
                <div class="screenshot-overlay" style="display: none;" id="overlay-${imageId}">
                    ${screenshot.timestamp ? formatTimestamp(screenshot.timestamp) : 'Live'}
                </div>
                <div class="screenshot-error" style="display: none;" id="error-${imageId}">
                    ❌ Failed to load image<br>
                    <small>Click to retry</small>
                </div>
            `;
        }

        function handleImageLoad(imageId) {
            console.log('✅ Image loaded successfully:', imageId);
            
            // Hide loading indicator
            const loadingEl = document.getElementById(`loading-${imageId}`);
            if (loadingEl) loadingEl.style.display = 'none';
            
            // Show image
            const imageEl = document.getElementById(imageId);
            if (imageEl) imageEl.style.display = 'block';
            
            // Show overlay
            const overlayEl = document.getElementById(`overlay-${imageId}`);
            if (overlayEl) overlayEl.style.display = 'block';
        }

        function handleImageError(imageId, userEmail) {
            console.error('❌ Image failed to load:', imageId);
            
            // Hide loading indicator
            const loadingEl = document.getElementById(`loading-${imageId}`);
            if (loadingEl) loadingEl.style.display = 'none';
            
            // Hide image
            const imageEl = document.getElementById(imageId);
            if (imageEl) imageEl.style.display = 'none';
            
            // Show error
            const errorEl = document.getElementById(`error-${imageId}`);
            if (errorEl) {
                errorEl.style.display = 'block';
                errorEl.onclick = () => retryImageLoad(imageId, userEmail);
            }
        }

        function retryImageLoad(imageId, userEmail) {
            console.log('🔄 Retrying image load:', imageId);
            
            const imageEl = document.getElementById(imageId);
            const errorEl = document.getElementById(`error-${imageId}`);
            const loadingEl = document.getElementById(`loading-${imageId}`);
            
            if (errorEl) errorEl.style.display = 'none';
            if (loadingEl) loadingEl.style.display = 'flex';
            
            if (imageEl) {
                // Force reload by changing src
                const originalSrc = imageEl.src;
                imageEl.src = '';
                setTimeout(() => {
                    imageEl.src = originalSrc + (originalSrc.includes('?') ? '&' : '?') + 'retry=' + Date.now();
                }, 100);
            }
        }

        function formatTimestamp(timestamp) {
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            } catch (e) {
                return 'Unknown';
            }
        }

        function showLoading() {
            document.getElementById('loadingContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner" style="margin: 0 auto 15px;"></div>
                    🔄 Loading live tracking data...
                </div>
            `;
        }

        function hideLoading() {
            document.getElementById('loadingContainer').innerHTML = '';
        }

        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <p><small>Check console for details</small></p>
                </div>
            `;
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        function toggleAutoRefresh() {
            if (isAutoRefreshEnabled) {
                // Disable auto refresh
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                isAutoRefreshEnabled = false;
                console.log('⏰ Auto refresh disabled');
            } else {
                // Enable auto refresh
                autoRefreshInterval = setInterval(loadLiveTracking, 30000);
                isAutoRefreshEnabled = true;
                console.log('⏰ Auto refresh enabled (30 seconds)');
            }
        }

        // Add event listeners for filter changes
        document.addEventListener('DOMContentLoaded', function() {
            loadLiveTracking();
            
            // Auto-refresh filters
            ['limitFilter', 'statusFilter', 'sortFilter'].forEach(id => {
                document.getElementById(id).addEventListener('change', loadLiveTracking);
            });
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }
            } else if (isAutoRefreshEnabled) {
                autoRefreshInterval = setInterval(loadLiveTracking, 30000);
                loadLiveTracking(); // Refresh immediately when tab becomes visible
            }
        });
    </script>
</body>
</html>
