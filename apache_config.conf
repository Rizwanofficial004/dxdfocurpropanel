# Apache Configuration for DDS Focus Time API
# Save this as /etc/apache2/sites-available/dxdtime.conf

<VirtualHost *:80>
    ServerName dxdtime.ddsolutions.io
    ServerAlias www.dxdtime.ddsolutions.io
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName dxdtime.ddsolutions.io
    ServerAlias www.dxdtime.ddsolutions.io
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    # SSLCertificateChainFile /path/to/your/chain.crt  # If you have a chain file
    
    # Document root (for static files)
    DocumentRoot /var/www/dxdtime
    
    # Django Application Configuration
    WSGIDaemonProcess dxdtime python-home=/path/to/your/venv python-path=/path/to/your/django/project
    WSGIProcessGroup dxdtime
    WSGIScriptAlias / /path/to/your/django/project/DDS/wsgi.py
    
    # Static files configuration
    Alias /static/ /path/to/your/django/project/static/
    <Directory /path/to/your/django/project/static/>
        Require all granted
    </Directory>
    
    # Media files configuration
    Alias /media/ /path/to/your/django/project/media/
    <Directory /path/to/your/django/project/media/>
        Require all granted
    </Directory>
    
    # Django project directory
    <Directory /path/to/your/django/project/DDS>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    # API specific configuration
    <Location /api/>
        # Enable CORS for API endpoints
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
        
        # Handle preflight OPTIONS requests
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=200,L]
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/dxdtime_error.log
    CustomLog ${APACHE_LOG_DIR}/dxdtime_access.log combined
    LogLevel info
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
</VirtualHost>

# Commands to enable this configuration:
# sudo a2ensite dxdtime.conf
# sudo a2enmod wsgi
# sudo a2enmod rewrite
# sudo a2enmod ssl
# sudo a2enmod headers
# sudo systemctl reload apache2
