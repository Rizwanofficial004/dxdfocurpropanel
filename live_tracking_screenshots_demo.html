<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking Screenshots API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .controls {
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            color: #a0aec0;
            font-size: 12px;
            font-weight: 500;
        }

        .control-group input, .control-group select {
            padding: 8px 12px;
            border: 1px solid #4a5568;
            border-radius: 6px;
            background: #1a202c;
            color: #ffffff;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #3182ce;
        }

        .btn-refresh {
            background: #48bb78;
        }

        .btn-refresh:hover {
            background: #38a169;
        }

        .summary {
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #4299e1;
        }

        .summary-item .label {
            color: #a0aec0;
            font-size: 14px;
            margin-top: 5px;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: #2d3748;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #4a5568;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .user-info h3 {
            margin-bottom: 4px;
            color: #ffffff;
        }

        .user-info .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .user-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            text-align: center;
            padding: 8px;
            background: #1a202c;
            border-radius: 6px;
        }

        .stat .number {
            font-weight: bold;
            color: #4299e1;
        }

        .stat .label {
            font-size: 11px;
            color: #a0aec0;
        }

        .screenshots-preview {
            margin-top: 15px;
        }

        .screenshots-preview h4 {
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .screenshot-thumb {
            aspect-ratio: 16/10;
            background: #1a202c;
            border-radius: 4px;
            border: 1px solid #4a5568;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .screenshot-thumb:hover {
            transform: scale(1.05);
        }

        .screenshot-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .screenshot-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            font-size: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .endpoint-info {
            background: #2d3748;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
            border-left: 4px solid #4299e1;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                width: 100%;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 Live Tracking Screenshots API</h1>
            <p>Real-time employee activity monitoring with screenshot previews</p>
        </div>

        <div class="endpoint-info">
            <strong>API Endpoint:</strong> GET /api/live-tracking/screenshots/
        </div>

        <div class="controls">
            <div class="control-group">
                <label>User Email (Optional)</label>
                <input type="email" id="emailFilter" placeholder="user@example.com">
            </div>
            
            <div class="control-group">
                <label>Status Filter</label>
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="idle">Idle</option>
                    <option value="offline">Offline</option>
                </select>
            </div>

            <div class="control-group">
                <label>Limit</label>
                <select id="limitFilter">
                    <option value="10">10 Users</option>
                    <option value="20">20 Users</option>
                    <option value="30">30 Users</option>
                    <option value="50">50 Users</option>
                </select>
            </div>

            <div class="control-group">
                <label>Mode</label>
                <select id="fastMode">
                    <option value="true">Fast Mode</option>
                    <option value="false">Full Mode</option>
                </select>
            </div>

            <div class="control-group">
                <label>Screenshots per User</label>
                <select id="screenshotsPerUser">
                    <option value="3">3 Screenshots</option>
                    <option value="5">5 Screenshots</option>
                    <option value="10">10 Screenshots</option>
                </select>
            </div>

            <button class="btn btn-refresh" onclick="loadLiveTracking()">🔄 Refresh</button>
            <button class="btn" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div id="errorContainer"></div>
        <div id="summaryContainer"></div>
        <div id="loadingContainer"></div>
        <div id="usersContainer"></div>
    </div>

    <script>
        let currentData = null;
        let autoRefreshInterval = null;

        // Load live tracking data
        async function loadLiveTracking() {
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const summaryContainer = document.getElementById('summaryContainer');
            const usersContainer = document.getElementById('usersContainer');

            // Show loading
            loadingContainer.innerHTML = '<div class="loading">🔄 Loading live tracking data...</div>';
            errorContainer.innerHTML = '';
            summaryContainer.innerHTML = '';
            usersContainer.innerHTML = '';

            try {
                // Build query parameters
                const params = new URLSearchParams();
                
                const email = document.getElementById('emailFilter').value.trim();
                if (email) params.append('email', email);
                
                params.append('status', document.getElementById('statusFilter').value);
                params.append('limit', document.getElementById('limitFilter').value);
                params.append('fast_mode', document.getElementById('fastMode').value);
                params.append('screenshots_per_user', document.getElementById('screenshotsPerUser').value);
                params.append('include_screenshots', 'true');

                // Make API call
                const response = await fetch(`/api/live-tracking/screenshots/?${params.toString()}`);
                const data = await response.json();

                loadingContainer.innerHTML = '';

                if (data.success) {
                    currentData = data.data;
                    displaySummary(data.data.summary);
                    displayUsers(data.data.users);
                } else {
                    throw new Error(data.message || 'Failed to load data');
                }

            } catch (error) {
                loadingContainer.innerHTML = '';
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        // Display summary statistics
        function displaySummary(summary) {
            const container = document.getElementById('summaryContainer');
            container.innerHTML = `
                <div class="summary">
                    <div class="summary-item">
                        <div class="number">${summary.total_users}</div>
                        <div class="label">Total Users</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.online_users}</div>
                        <div class="label">Online Users</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.active_users}</div>
                        <div class="label">Active</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.idle_users}</div>
                        <div class="label">Idle</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.offline_users}</div>
                        <div class="label">Offline</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${summary.total_screenshots}</div>
                        <div class="label">Total Screenshots</div>
                    </div>
                </div>
            `;
        }

        // Display users grid
        function displayUsers(users) {
            const container = document.getElementById('usersContainer');
            
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="loading">No users found matching the criteria</div>';
                return;
            }

            const usersHTML = users.map(user => {
                const initials = user.user_name.split(' ').map(n => n[0]).join('').toUpperCase();
                const screenshots = user.screenshots || [];
                
                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div class="user-avatar">${initials}</div>
                            <div class="user-info">
                                <h3>${user.user_name}</h3>
                                <div class="status">
                                    <div class="status-dot" style="background-color: ${user.status_color}"></div>
                                    ${user.status.charAt(0).toUpperCase() + user.status.slice(1)}
                                </div>
                            </div>
                        </div>

                        <div class="user-stats">
                            <div class="stat">
                                <div class="number">${user.screenshot_count}</div>
                                <div class="label">Screenshots</div>
                            </div>
                            <div class="stat">
                                <div class="number">${user.last_activity || 'Unknown'}</div>
                                <div class="label">Last Activity</div>
                            </div>
                        </div>

                        <div class="screenshots-preview">
                            <h4>Latest Screenshots</h4>
                            <div class="screenshots-grid">
                                ${screenshots.slice(0, 3).map(screenshot => `
                                    <div class="screenshot-thumb" onclick="openScreenshot('${screenshot.url}', '${screenshot.filename}')">
                                        <img src="${screenshot.url}" alt="${screenshot.filename}" 
                                             onerror="this.parentElement.innerHTML='<div class=screenshot-placeholder>📸</div>'">
                                    </div>
                                `).join('')}
                                ${Array(Math.max(0, 3 - screenshots.length)).fill().map(() => `
                                    <div class="screenshot-thumb">
                                        <div class="screenshot-placeholder">📷</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="users-grid">${usersHTML}</div>`;
        }

        // Open screenshot in new window
        function openScreenshot(url, filename) {
            window.open(url, '_blank');
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('emailFilter').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('limitFilter').value = '10';
            document.getElementById('fastMode').value = 'true';
            document.getElementById('screenshotsPerUser').value = '3';
        }

        // Auto refresh toggle
        function toggleAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            } else {
                autoRefreshInterval = setInterval(loadLiveTracking, 30000); // 30 seconds
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadLiveTracking();
            
            // Auto refresh every 30 seconds
            autoRefreshInterval = setInterval(loadLiveTracking, 30000);
        });

        // Handle page visibility change to pause/resume auto refresh
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            } else {
                if (!autoRefreshInterval) {
                    autoRefreshInterval = setInterval(loadLiveTracking, 30000);
                }
            }
        });
    </script>
</body>
</html>
