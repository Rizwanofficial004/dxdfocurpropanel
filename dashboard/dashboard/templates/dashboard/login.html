{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "DDS Focus Login V-1" %}</title>
    <link rel="stylesheet" href="./dashboard/static/css/login.css">
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #2a2f38;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    background-color: #2a353f;
    border-radius: 8px;
    padding: 30px;
    width: 350px;
    box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.8s forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    margin-bottom: 25px;
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.logo img {
    width: 120px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.title {
    color: #ffffff;
    text-align: center;
    margin-bottom: 20px;
    font-size: 18px;
}

.form-group {
    margin-bottom: 20px;
}

.form-control {
    width: 100%;
    padding: 12px;
    background-color: #2a353f;
    border: 1px solid #3a424e;
    border-radius: 4px;
    color: #ffffff;
    outline: none;
    transition: border-color 0.3s;
}

.form-control:focus {
    border-color: #22b8cf;
    box-shadow: 0 0 0 2px rgba(34, 184, 207, 0.2);
}

.form-group label {
    color: #a0aab8;
    display: block;
    margin-bottom: 5px;
}

.checkbox-container {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.checkbox-container input {
    margin-right: 5px;
}

.checkbox-container label {
    color: #a0aab8;
    cursor: pointer;
}

.login-button {
    width: 100%;
    padding: 12px;
    background-color: #13c2de;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: background-color 0.3s, transform 0.2s;
}

.login-button:hover {
    background-color: #11b3cd;
}

.login-button:active {
    transform: scale(0.98);
}

.footer {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    color: #a0aab8;
    font-size: 14px;
}

.footer a {
    color: #a0aab8;
    text-decoration: none;
    transition: color 0.3s;
}

.footer a:hover {
    color: #13c2de;
}

.lock-icon {
    margin-right: 5px;
    color: #a0aab8;
}

/* Alert message styling */
.alert {
    padding: 10px;
    background-color: #f44336;
    color: white;
    border-radius: 4px;
    margin-bottom: 15px;
    display: none;
    animation: shake 0.5s;
    text-align: center;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}

.input-wrapper {
    position: relative;
}

.input-focus-border {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background-color: #13c2de;
    transition: width 0.3s;
}

.form-control:focus + .input-focus-border {
    width: 100%;
}














/* Language Switcher */
.footer form {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;


        width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.footer form label {
    color: #a0aab8;
    margin-bottom: 8px;
    font-size: 14px;
}

#lang-switch {
    background-color: #2a353f;
    border: 1px solid #3a424e;
    color: #ffffff;
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.3s;
    width: 100%;
    max-width: 150px;
    outline: none;
    font-size: 14px;
}

#lang-switch:hover {
    border-color: #13c2de;
}

#lang-switch:focus {
    border-color: #13c2de;
    box-shadow: 0 0 0 2px rgba(19, 194, 222, 0.2);
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive adjustments */
@media (max-width: 480px) {
    .login-container {
        padding: 30px 20px;
    }
    
    .title {
        font-size: 24px;
        margin-bottom: 20px;
    }
    
    .form-control {
        height: 44px;
    }
    
    .login-button {
        height: 44px;
    }
}
</style>

<body>
    <div class="login-container">
        <div class="logo">
            <!-- You can add your SVG logo here -->
        </div>

        <div class="title">{% trans "Sign In" %}</div>

        {% if error %}
        <div class="alert" style="display:block">{{ error }}</div>
        {% endif %}

        <form id="login-form" method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" name="username" class="form-control" placeholder="{% trans 'Username' %}"
                        required>
                    <span class="input-focus-border"></span>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" name="password" class="form-control" placeholder="{% trans 'Password' %}"
                        required>
                    <span class="input-focus-border"></span>
                </div>
            </div>

            <button type="submit" class="login-button" id="login-btn">{% trans "Log In" %}</button>
        </form>

        <div class="footer">
            <a href="https://crm.deluxebilisim.com/admin/authentication/forgot_password"><span class="lock-icon">🔒</span>{% trans "Forgot your password?" %}</a>
        </div>

        <!-- Language switcher -->
        <!-- <form id="langForm" action="{% url 'set_language' %}" method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <select id="lang-switch" name="language" style="padding: 6px; border-radius: 5px;">
                <option value="tr" {% if LANGUAGE_CODE == "tr" %}selected{% endif %}>Türkçe</option>
                <option value="en" {% if LANGUAGE_CODE == "en" %}selected{% endif %}>English</option>
            </select>
        </form> -->
    </div>

    <script>
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', () => input.parentElement.classList.add('focused'));
            input.addEventListener('blur', () => {
                if (input.value === '') input.parentElement.classList.remove('focused');
            });
        });

        document.getElementById('lang-switch').addEventListener('change', function () {
            const lang = this.value;
            const form = document.getElementById('langForm');
            const formData = new FormData(form);

            fetch("{% url 'set_language' %}", {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            }).then(() => {
                const currentPath = window.location.pathname;

                // Clean path to avoid double /en/en or /tr/tr
                const cleanedPath = currentPath.replace(/^\/(en|tr)/, '');

                // Redirect based on selected language
                window.location.href = `/${lang}${cleanedPath}`;
            }).catch(error => {
                console.error("Language switch failed:", error);
            });
        });

        // Ensure the correct language is reflected in the dropdown on page load
        document.addEventListener('DOMContentLoaded', function () {
            const langSwitch = document.getElementById('lang-switch');
            const currentLang = "{{ LANGUAGE_CODE }}";
            langSwitch.value = currentLang;

            // Set the selected language in the dropdown button
            const selectedOption = langSwitch.querySelector(`option[value="${currentLang}"]`);
            if (selectedOption) {
                selectedOption.setAttribute('selected', 'selected');
            }
        });
    </script>
</body>

</html>
