<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshots Timeline - DDS Focus Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .date-selector, .view-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .date-selector option, .view-selector option {
            background: #764ba2;
            color: white;
        }

        .refresh-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .user-info h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .user-email {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .screenshot-count {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .screenshots-section {
            margin-top: 20px;
        }

        .screenshots-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .screenshots-header h4 {
            font-size: 1.1rem;
            color: #fff;
            opacity: 0.9;
        }

        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .screenshot-thumbnail {
            aspect-ratio: 16/9;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .screenshot-thumbnail:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .screenshot-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .screenshot-placeholder {
            font-size: 1.5rem;
            opacity: 0.5;
        }

        .screenshot-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 5px;
            font-size: 0.7rem;
            text-align: center;
        }

        .user-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .stat-item .label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 3px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .no-screenshots {
            text-align: center;
            padding: 50px;
            opacity: 0.7;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .refresh-info {
            text-align: center;
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Screenshots Timeline</h1>
            <div class="controls">
                <input type="date" class="date-selector" id="date-selector">
                <select class="view-selector" id="period-selector">
                    <option value="">Custom Date</option>
                    <option value="today" selected>Today</option>
                    <option value="this-week">This Week</option>
                    <option value="this-month">This Month</option>
                    <option value="this-3-months">Last 3 Months</option>
                    <option value="this-year">This Year</option>
                </select>
                <select class="view-selector" id="view-selector">
                    <option value="cards">User Cards</option>
                    <option value="list">Simple List</option>
                </select>
                <select class="view-selector" id="limit-selector">
                    <option value="5">5 per user</option>
                    <option value="10" selected>10 per user</option>
                    <option value="20">20 per user</option>
                </select>
                <button class="refresh-btn" id="refresh-btn">🔄 Refresh</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-users">0</div>
                <div class="stat-label">Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-screenshots">0</div>
                <div class="stat-label">Screenshots</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-size">0 MB</div>
                <div class="stat-label">Total Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="date-display">Today</div>
                <div class="stat-label">Date</div>
            </div>
        </div>

        <div id="screenshots-container">
            <div class="loading pulse">📸 Loading screenshots timeline...</div>
        </div>

        <div class="refresh-info">
            <p>📅 Showing screenshots organized by users | Last updated: <span id="last-update">Never</span></p>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            initializeDateSelector();
            loadScreenshotsTimeline();
        });

        function setupEventListeners() {
            document.getElementById('refresh-btn').addEventListener('click', loadScreenshotsTimeline);
            document.getElementById('date-selector').addEventListener('change', loadScreenshotsTimeline);
            document.getElementById('period-selector').addEventListener('change', handlePeriodChange);
            document.getElementById('view-selector').addEventListener('change', loadScreenshotsTimeline);
            document.getElementById('limit-selector').addEventListener('change', loadScreenshotsTimeline);
        }

        function handlePeriodChange() {
            const periodSelector = document.getElementById('period-selector');
            const dateSelector = document.getElementById('date-selector');
            
            if (periodSelector.value) {
                // If a period is selected, disable custom date
                dateSelector.disabled = true;
                dateSelector.style.opacity = '0.5';
            } else {
                // If custom date is selected, enable date picker
                dateSelector.disabled = false;
                dateSelector.style.opacity = '1';
            }
            
            loadScreenshotsTimeline();
        }

        function initializeDateSelector() {
            const dateSelector = document.getElementById('date-selector');
            const today = new Date().toISOString().split('T')[0];
            dateSelector.value = today;
        }

        async function loadScreenshotsTimeline() {
            showLoading();
            
            try {
                const selectedDate = document.getElementById('date-selector').value;
                const selectedPeriod = document.getElementById('period-selector').value;
                const viewFormat = document.getElementById('view-selector').value;
                const limitPerUser = document.getElementById('limit-selector').value;
                
                let apiUrl = `${API_BASE}/screenshots/timeline/?view=${viewFormat}&limit=${limitPerUser}&include_thumbnails=true`;
                
                if (selectedPeriod) {
                    apiUrl += `&period=${selectedPeriod}`;
                } else if (selectedDate) {
                    apiUrl += `&date=${selectedDate}`;
                }
                
                console.log('🔥 Fetching screenshots timeline:', apiUrl);
                
                const response = await fetch(apiUrl);
                const result = await response.json();
                
                console.log('📱 API Response:', result);
                
                if (result.success) {
                    updateStats(result.data.summary, result.data.filters);
                    displayScreenshots(result.data, viewFormat);
                    updateLastUpdateTime();
                } else {
                    showError(`API Error: ${result.message}`);
                }
                
            } catch (error) {
                console.error('❌ Error loading screenshots timeline:', error);
                showError(`Network error: ${error.message}`);
            }
        }

        function updateStats(summary, filters) {
            document.getElementById('total-users').textContent = summary.total_users || 0;
            document.getElementById('total-screenshots').textContent = summary.total_screenshots || 0;
            document.getElementById('total-size').textContent = `${summary.total_size_mb || 0} MB`;
            
            // Update date display based on period or custom date
            if (filters.period_display) {
                document.getElementById('date-display').textContent = filters.period_display;
            } else {
                const selectedDate = document.getElementById('date-selector').value;
                const dateObj = new Date(selectedDate);
                const today = new Date().toISOString().split('T')[0];
                
                if (selectedDate === today) {
                    document.getElementById('date-display').textContent = 'Today';
                } else {
                    document.getElementById('date-display').textContent = dateObj.toLocaleDateString();
                }
            }
        }

        function displayScreenshots(data, viewFormat) {
            const container = document.getElementById('screenshots-container');
            
            if (viewFormat === 'cards') {
                displayUserCards(data.users, container);
            } else {
                displaySimpleList(data.screenshots, container);
            }
        }

        function displayUserCards(users, container) {
            if (!users || users.length === 0) {
                container.innerHTML = `
                    <div class="no-screenshots">
                        <h3>📭 No Screenshots Found</h3>
                        <p>No screenshots were found for the selected date.</p>
                        <p><small>Try selecting a different date or check if screenshots are being captured.</small></p>
                    </div>
                `;
                return;
            }

            const cardsHTML = users.map(user => {
                const userInitials = user.user_name ? user.user_name.split(' ').map(n => n[0]).join('').toUpperCase() : user.user_email[0].toUpperCase();
                
                const screenshotsHTML = user.screenshots && user.screenshots.length > 0 
                    ? user.screenshots.map(screenshot => {
                        return `
                            <div class="screenshot-thumbnail" title="${screenshot.file_name}">
                                ${screenshot.thumbnail_url ? 
                                    `<img src="${screenshot.thumbnail_url}" alt="${screenshot.file_name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                     <div class="screenshot-placeholder" style="display:none;">📷</div>` :
                                    `<div class="screenshot-placeholder">📷</div>`
                                }
                                <div class="screenshot-info">
                                    ${screenshot.time_ago || 'Unknown time'}
                                </div>
                            </div>
                        `;
                    }).join('')
                    : '<div class="screenshot-placeholder">No screenshots</div>';

                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div class="user-avatar">${userInitials}</div>
                                <div class="user-info">
                                    <h3>${user.user_name || user.user_email.split('@')[0]}</h3>
                                    <div class="user-email">${user.user_email}</div>
                                </div>
                            </div>
                            <div class="screenshot-count">${user.screenshot_count} 📸</div>
                        </div>
                        
                        ${user.screenshots && user.screenshots.length > 0 ? `
                            <div class="screenshots-section">
                                <div class="screenshots-header">
                                    <h4>Latest Screenshots</h4>
                                </div>
                                <div class="screenshots-grid">
                                    ${screenshotsHTML}
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="user-stats">
                            <div class="stat-item">
                                <div class="value">${user.total_size_mb || 0} MB</div>
                                <div class="label">Total Size</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${user.latest_screenshot ? formatTimeAgo(user.latest_screenshot) : 'None'}</div>
                                <div class="label">Latest</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="users-grid">${cardsHTML}</div>`;
        }

        function displaySimpleList(screenshots, container) {
            if (!screenshots || screenshots.length === 0) {
                container.innerHTML = `
                    <div class="no-screenshots">
                        <h3>📭 No Screenshots Found</h3>
                        <p>No screenshots were found for the selected date.</p>
                    </div>
                `;
                return;
            }

            const listHTML = screenshots.map(screenshot => {
                return `
                    <div class="user-card" style="margin-bottom: 15px;">
                        <div class="user-header">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div class="screenshot-thumbnail" style="width: 80px; height: 60px;">
                                    ${screenshot.thumbnail_url ? 
                                        `<img src="${screenshot.thumbnail_url}" alt="${screenshot.file_name}">` :
                                        `<div class="screenshot-placeholder">📷</div>`
                                    }
                                </div>
                                <div class="user-info">
                                    <h3>${screenshot.file_name}</h3>
                                    <div class="user-email">${screenshot.user_email} • ${screenshot.time_ago}</div>
                                </div>
                            </div>
                            <div class="screenshot-count">${screenshot.size_mb} MB</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = listHTML;
        }

        function formatTimeAgo(dateString) {
            if (!dateString) return 'Unknown';
            
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffHours / 24);
            
            if (diffDays > 0) {
                return `${diffDays}d ago`;
            } else if (diffHours > 0) {
                return `${diffHours}h ago`;
            } else {
                return 'Recent';
            }
        }

        function showLoading() {
            document.getElementById('screenshots-container').innerHTML = `
                <div class="loading pulse">📸 Loading screenshots timeline...</div>
            `;
        }

        function showError(message) {
            document.getElementById('screenshots-container').innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <p><small>Make sure the Django server is running on http://127.0.0.1:8000</small></p>
                </div>
            `;
        }

        function updateLastUpdateTime() {
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
        }
    </script>
</body>
</html>
