<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking Dashboard - DDS Focus Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Override unwanted pseudo-element content from extensions */
        .dRSeQr::before,
        .dRSeQr::after,
        *[class*="dRSeQr"]::before,
        *[class*="dRSeQr"]::after {
            content: none !important;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: none !important;
        }

        /* Ensure clean pseudo-elements on images */
        img::before,
        img::after,
        .screenshot::before,
        .screenshot::after,
        .user-screenshot::before,
        .user-screenshot::after {
            content: none !important;
            display: none !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .status-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: relative;
        }

        .status-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid white;
        }

        .user-info h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .user-info p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .user-activity {
            margin-bottom: 15px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .activity-label {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .activity-value {
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .refresh-info {
            text-align: center;
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 Live Tracking</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <select class="date-selector" id="date-selector">
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="this-week">This Week</option>
                </select>
                <div class="status-filters">
                    <button class="filter-btn active" data-status="all">All (0)</button>
                    <button class="filter-btn" data-status="active">Active (0)</button>
                    <button class="filter-btn" data-status="meeting">Meeting (0)</button>
                    <button class="filter-btn" data-status="break">Break (0)</button>
                    <button class="filter-btn" data-status="idle">Idle (0)</button>
                    <button class="filter-btn" data-status="offline">Offline (0)</button>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-users">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="online-users">0</div>
                <div class="stat-label">Online Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="active-users">0</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avg-productivity">0%</div>
                <div class="stat-label">Avg Productivity</div>
            </div>
        </div>

        <div id="users-container">
            <div class="loading pulse">🔄 Loading live tracking data...</div>
        </div>

        <div class="refresh-info">
            <p>🔄 Auto-refreshing every 30 seconds | Last updated: <span id="last-update">Never</span></p>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let refreshInterval;

        // API Configuration
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadLiveTrackingData();
            startAutoRefresh();
        });

        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.status;
                    loadLiveTrackingData();
                });
            });
            
            // Date selector
            document.getElementById('date-selector').addEventListener('change', function() {
                loadLiveTrackingData();
            });
        }

        async function loadLiveTrackingData() {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE}/live-tracking/?status=${currentFilter}&limit=100`);
                const data = await response.json();
                
                if (data.success) {
                    updateDashboard(data.data);
                } else {
                    showError('Failed to load tracking data: ' + data.message);
                }
            } catch (error) {
                console.error('Error loading live tracking data:', error);
                showError('Connection error. Please check if the server is running.');
            }
        }

        function updateDashboard(data) {
            // Update statistics
            updateStatistics(data.summary, data.status_statistics);
            
            // Update filter buttons with counts
            updateFilterButtons(data.status_statistics);
            
            // Render user cards
            renderUserCards(data.live_users);
            
            // Update last refresh time
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
        }

        function updateStatistics(summary, statusStats) {
            document.getElementById('total-users').textContent = statusStats.total || 0;
            document.getElementById('online-users').textContent = summary.total_online_users || 0;
            document.getElementById('active-users').textContent = summary.total_active_users || 0;
            document.getElementById('avg-productivity').textContent = summary.average_productivity + '%' || '0%';
        }

        function updateFilterButtons(statusStats) {
            document.querySelector('[data-status="all"]').textContent = `All (${statusStats.total || 0})`;
            document.querySelector('[data-status="active"]').textContent = `Active (${statusStats.active || 0})`;
            document.querySelector('[data-status="meeting"]').textContent = `Meeting (${statusStats.meeting || 0})`;
            document.querySelector('[data-status="break"]').textContent = `Break (${statusStats.break || 0})`;
            document.querySelector('[data-status="idle"]').textContent = `Idle (${statusStats.idle || 0})`;
            document.querySelector('[data-status="offline"]').textContent = `Offline (${statusStats.offline || 0})`;
        }

        function renderUserCards(users) {
            const container = document.getElementById('users-container');
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <p>No users found with status: <strong>${currentFilter}</strong></p>
                        <p>Try selecting a different filter above.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="users-grid">
                    ${users.map(user => createUserCard(user)).join('')}
                </div>
            `;
        }

        function createUserCard(user) {
            const initials = user.first_name.charAt(0) + user.last_name.charAt(0);
            const statusColor = user.status_color || '#6B7280';
            
            return `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-avatar">
                            ${initials}
                            <div class="status-indicator" style="background-color: ${statusColor}"></div>
                        </div>
                        <div class="user-info">
                            <h3>${user.display_name}</h3>
                            <p>${user.email}</p>
                        </div>
                    </div>
                    
                    <div class="user-activity">
                        <div class="activity-item">
                            <span class="activity-label">Status</span>
                            <span class="status-badge" style="background-color: ${statusColor}; color: white;">
                                ${user.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Current Activity</span>
                            <span class="activity-value">${user.current_activity}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Task</span>
                            <span class="activity-value">${user.current_task}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Project</span>
                            <span class="activity-value">${user.current_project}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Location</span>
                            <span class="activity-value">${user.location}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Time Tracked</span>
                            <span class="activity-value">${formatTime(user.time_tracked_today)}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Screenshots</span>
                            <span class="activity-value">${user.screenshot_count}</span>
                        </div>
                        <div class="activity-item">
                            <span class="activity-label">Productivity</span>
                            <span class="activity-value">${user.productivity_score}%</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function formatTime(seconds) {
            if (!seconds || seconds === 0) return '0h 0m';
            
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            
            return `${hours}h ${minutes}m`;
        }

        function showLoading() {
            document.getElementById('users-container').innerHTML = `
                <div class="loading pulse">🔄 Loading live tracking data...</div>
            `;
        }

        function showError(message) {
            document.getElementById('users-container').innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <p><small>Make sure the Django server is running on http://127.0.0.1:8000</small></p>
                </div>
            `;
        }

        function startAutoRefresh() {
            // Refresh every 30 seconds
            refreshInterval = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadLiveTrackingData();
                }
            }, 30000);
            
            // Pause refresh when tab is not visible
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    loadLiveTrackingData();
                }
            });
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
