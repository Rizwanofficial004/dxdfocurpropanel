<script>
async function showUserTimeline(query) {
    const container = document.getElementById('timeline-container');
    container.innerHTML = '<div style="text-align:center;padding:20px;">Loading...</div>';
    const resp = await fetch('/search_user_logs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query})
    });
    const data = await resp.json();
    if (data.categories && Object.keys(data.categories).length > 0) {
        let html = '<h3>Categories</h3><ul>';
        for (const [cat, mins] of Object.entries(data.categories)) {
            html += `<li><b>${cat}</b>: ${mins}</li>`;
        }
        html += '</ul><h3>Programs</h3><ul>';
        for (const [prog, mins] of Object.entries(data.programs)) {
            html += `<li><b>${prog}</b>: ${mins}</li>`;
        }
        html += '</ul>';
        container.innerHTML = html;
    } else {
        container.innerHTML = `
            <div style="text-align: center; padding: 20px; color: #999;">
                <div style="font-size: 24px; margin-bottom: 10px;">📊</div>
                <p style="color: #777; font-size: 14px;">No timeline data available</p>
                <p style="color: #555; font-size: 12px; margin-top: 5px;">This user has no activity logs</p>
            </div>
        `;
    }
}
// Example usage: showUserTimeline('Hamza Haseeb');
</script>
