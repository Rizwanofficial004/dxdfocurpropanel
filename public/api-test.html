<!DOCTYPE html>
<html>
<head>
    <title>Registration API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e8; border-color: #4caf50; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Registration API Test</h1>
    <button onclick="testAPI()">Test Registration API</button>
    <button onclick="clearResults()">Clear Results</button>
    <div id="results"></div>

    <script>
        function addResult(title, content, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = '<h3>' + title + '</h3><pre>' + content + '</pre>';
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testAPI() {
            clearResults();
            
            const testData = {
                email: "test" + Date.now() + "@example.com",
                username: "testuser" + Date.now(),
                password: "TestPass123!",
                password_confirm: "TestPass123!",
                first_name: "Test",
                last_name: "User",
                organization_name: "Test Organization",
                country: "USA"
            };
            
            addResult('Test Data', JSON.stringify(testData, null, 2));
            
            // Test proxy endpoint
            try {
                console.log('Testing proxy endpoint...');
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify(testData)
                });
                
                const responseText = await response.text();
                
                const result = {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries()),
                    body: responseText.substring(0, 1000) + (responseText.length > 1000 ? '...[truncated]' : '')
                };
                
                if (response.ok) {
                    addResult('Proxy Test - SUCCESS', JSON.stringify(result, null, 2));
                } else {
                    addResult('Proxy Test - FAILED', JSON.stringify(result, null, 2), true);
                }
                
            } catch (error) {
                addResult('Proxy Test - ERROR', error.message, true);
            }
            
            // Test direct API call
            try {
                console.log('Testing direct API call...');
                const response = await fetch('https://dxdtime.ddsolutions.io/api/auth/register/', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const responseText = await response.text();
                
                const result = {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries()),
                    body: responseText.substring(0, 1000) + (responseText.length > 1000 ? '...[truncated]' : '')
                };
                
                if (response.ok) {
                    addResult('Direct API Test - SUCCESS', JSON.stringify(result, null, 2));
                } else {
                    addResult('Direct API Test - FAILED', JSON.stringify(result, null, 2), true);
                }
                
            } catch (error) {
                addResult('Direct API Test - ERROR', error.message, true);
            }
        }
    </script>
</body>
</html>
